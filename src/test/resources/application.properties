# Database Configuration for Development (Local MySQL)
# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:test;MODE=MySQL;
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=testing
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

#spring.jpa.defer-datasource-initialization=true
#spring.sql.init.mode=never

# JPA Settings for Development
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.hibernate.ddl-auto=update

# REDIS Configuration for Development (Local Redis - Docker)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Frontend URL for Local Development
app.frontend.url=http://localhost:3000

# AI Inference Configuration
ai.api.url=${API_URL}
ai.api.token=${API_TOKEN}
ai.api.model=${MODEL}

ai.api.user-role=${AI_API_USER_ROLE:user}
ai.api.system-role=${AI_API_SYSTEM_ROLE:system}
ai.api.temperature=${AI_API_TEMPERATURE:0.7}
ai.api.top-p=${AI_API_TOP_P:0.9}

# JWT Configuration
jwt.access-token.expiration-minutes=15
jwt.refresh-token.expiration-days=7

# JWT KeyStore Configuration
jwt.keystore.location=classpath:keys/jwt-keystore.jks
jwt.keystore.password=test
jwt.key.password=test

# JWT Key Rotation Configuration
jwt.signing.key.alias=jwtkey-2025
jwt.verification.key.aliases=jwtkey-2025