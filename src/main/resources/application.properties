spring.application.name=smart-notes
server.port=8080

# Environment
spring.config.import=file:.env[.properties]

# Database
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.diver-class-name =com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AI Inference Configuration
ai.api.url=${API_URL}
ai.api.token=${API_TOKEN}
ai.api.model=${MODEL}

ai.api.user-role=${AI_API_USER_ROLE:user}
ai.api.system-role=${AI_API_SYSTEM_ROLE:system}
ai.api.temperature=${AI_API_TEMPERATURE:0.7}
ai.api.top-p=${AI_API_TOP_P:0.9}

# JWT Configuration
jwt.access-token.expiration-minutes=15
jwt.refresh-token.expiration-days=7

# JWT KeyStore Configuration
jwt.keystore.location=classpath:keys/jwt-keystore.jks
jwt.keystore.password=PhuVoDev
jwt.key.password=AliceTat

# JWT Key Rotation Configuration
jwt.signing.key.alias=jwtkey-2025
jwt.verification.key.aliases=jwtkey-2025

# Spring Data Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379