# Database Configuration for Production (AWS RDS)
spring.datasource.url=jdbc:mysql://${RDS_HOST}:${RDS_PORT}/${RDS_DB_NAME}
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Settings for Production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate

# REDIS Configuration for Production (AWS ElastiCache)
spring.data.redis.host=${ELASTICACHE_HOST}
spring.data.redis.port=${ELASTICACHE_PORT}

# Frontend URL for Production (Vercel)
app.frontend.url=https://${VERCEL_FRONTEND_DOMAIN}

# Logging Level for Production
logging.level.com.be08=INFO